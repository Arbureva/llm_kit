name: llm_kit
description: A small, transport-injectable LLM client for Flutter and Dart with typed streaming events, reasoning support, and pluggable OpenAI/Anthropic providers.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0

# Note: the core library depends only on package:http for the *default*
# transport. It has no Flutter dependency, so it runs in pure-Dart contexts
# (CLI, server, tests) too. To use Dio, you don't add it here — you write a
# DioTransport in your app and inject it. See README.
dependencies:
  http: ^1.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
